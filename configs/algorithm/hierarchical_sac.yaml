# @package agent
# Scaling-CRL worker and BroNet SAC manager. Entropy is in tanh coordinates.
manager_enabled: true
freeze_worker: false
actor_lr: 3e-4
critic_lr: 3e-4
alpha_lr: 3e-4
actor_network_width: 256
critic_network_width: 256
actor_depth: 8
critic_depth: 8
use_relu: 0
logsumexp_penalty_coeff: 0.1
worker_discount: 0.99
worker_entropy_coefficient: 0.5
manager_width: 256
manager_num_blocks: 2
policy_hidden_layer_sizes: [256, 256]
value_hidden_layer_sizes: [256, 256]
manager_activation: relu
manager_lr: 3e-4
manager_discount: ${discount}
manager_discount_per_step: false
manager_tau: 0.005
manager_init_temperature: 1.0
manager_entropy_coefficient: 0.5
manager_worker_weight: 0.0
subgoal_steps: 25
manager_learn_duration: true
max_subgoal_steps: ${episode_length}
# Shared 4D position/command counts; zero scale disables the replay bonus.
manager_count_bins: 32
manager_count_bonus_scale: 0.0
# Training-only selection by mean Q + count bonus; 1 uses the SAC sample.
manager_action_candidates: 1
# Relabel missed maze XY commands to achieved endpoints after full nonterminal intervals.
manager_hindsight_relabel: false
manager_hindsight_goal_tolerance: 0.5
batch_size: 512
