# @package _global_
# Fresh SAC manager over a frozen pretrained CRL worker.
defaults:
  - ant_big_maze_worker
  - _self_

run_group: ant-big-maze-manager
worker_checkpoint: ???
agent:
  manager_enabled: true
  freeze_worker: true
  # Interior of the 8x8 maze with cell size 4 (including internal walls).
  goal_low: [2.0, 2.0]
  goal_high: [26.0, 26.0]
