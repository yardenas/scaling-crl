# @package _global_
# Paper-scale Ant Big Maze with our CRL worker, without a manager.
run_group: ant-big-maze-worker
env_id: ant_big_maze
eval_env_id: ant_big_maze_eval
backend: spring
episode_length: 1000
num_envs: 512
eval_episodes: 128
online_steps: 100000000
max_runtime_seconds: null
unroll_length: 62
buffer_size: 5120000
start_training: 512000
# Reference job: 800 minibatches per 512 * 62 primitive steps (~1:40).
updates_per_collect: 800
log_interval: 317440
eval_interval: 984064
save_interval: 984064
save_replay: true
capture_vis: false
agent:
  manager_enabled: false
  actor_depth: 8
  critic_depth: 8
  actor_network_width: 256
  critic_network_width: 256
  batch_size: 512

hydra:
  sweeper:
    params:
      seed: 0,1,2,3,4
