[project]
name = "scaling-crl"
version = "0.1.0"
description = "1000 Layer Networks for Self-Supervised RL: Scaling Depth Can Enable New Goal-Reaching Capabilities"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy==1.26.4",
    "jax[cuda12_pip]==0.4.23; platform_system == 'Linux'",
    "jax==0.4.23; platform_system != 'Linux'",
    "jaxlib==0.4.23+cuda12.cudnn89; platform_system == 'Linux'",
    "nvidia-cudnn-cu12>=8.9,<9.0; platform_system == 'Linux'",
    "jaxlib==0.4.23; platform_system != 'Linux'",
    "flax==0.7.4",
    "tyro",
    "hydra-core>=1.3.2,<2",
    "hydra-submitit-launcher>=1.2.0,<2",
    "wandb==0.17.9",
    "wandb-osh==1.2.2",
    "brax==0.10.1",
    "mediapy==1.2.2",
    "scipy==1.12.0",
    "mujoco==3.2.6"
]

[tool.uv]
# JAX 0.4.23's CUDA wheel is hosted separately from PyPI.
find-links = ["https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"
